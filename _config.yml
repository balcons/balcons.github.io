# Site settings
title: Find your balcony on the map!
email: balconsche@gmail.com
url: https://balcons.github.io
description: "Enjoy the balconies!"

# Contact form: comment the line below if you want to stick with the default PHP contact form
contact: static

# Color settings (hex-codes without the leading hash-tag)
color:
  primary: a1d5ff     
  secondary: 76c2ff #FD6E8A bfbfbf 2c3e50
  secondary-dark: c5c5c5 #233140 A2122F

# Footer settings
footer:
  copyright: Chervinska
  location: Location
#  social: Around the Web
  credits: Credits

# Social networks usernames (many more available: google-plus, flickr, dribbble, pinterest, instagram, tumblr, linkedin, etc.)
#social:
#  - title: twitter
#    url: http://twitter.com/itmaryna
#  - title: facebook
#    url: https://www.facebook.com/marina.dollarbill
#  - title: behance
#    url: http://behance.com/itmaryna
#  - title: github
#    url: http://github.com/itmaryna

# Postal address (add as many lines as necessary)
address:
  - line: Barcelona, Spain

# Credits content
credits: 'Jerome Lachaud'

# Shop / Stripe (publishable key is safe in the browser; secret key stays in Netlify env)
shop:
  currency: eur
  shipping_spain_eur: 7
  shipping_international_eur: 14
  # Create at https://dashboard.stripe.com/apikeys — use test keys locally
  stripe_publishable_key: ""
  # Netlify function URL after deploy, e.g. https://yoursite.netlify.app/.netlify/functions/create-checkout
  # Local: http://127.0.0.1:8888/.netlify/functions/create-checkout (netlify dev)
  checkout_api_url: "/.netlify/functions/create-checkout"
  custom_print_email: balconsche@gmail.com

# Build settings
markdown: kramdown
permalink: pretty

collections:
  products:
    output: false

defaults:
  - scope:
      path: ""
      type: products
    values:
      layout: null

plugins:
  - jekyll-sitemap

# Legacy alias (older Jekyll)
gems:
  - jekyll-sitemap
